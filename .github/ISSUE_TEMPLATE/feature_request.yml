name: Feature request
description: Suggest a capability, rule, register, or provider for Limpid.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Tell us the problem first, then the proposal.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What writing or workflow problem does this address? Who hits it?
      placeholder: I write grant proposals and want the coach to flag passive constructions more aggressively.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Limpid do? A new rule, register, provider, command, or setting.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples of good/bad prose, references (Orwell, Strunk & White, the Economist), or mockups.
    validations:
      required: false
