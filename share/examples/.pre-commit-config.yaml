# Gate prose with the Limpid CLI before each commit (https://pre-commit.com).
# Adjust the path to the CLI and the thresholds to taste:
#   - from this bundle:  node /abs/path/to/limpid-share-<version>/cli/limpid.js
#   - from the repo:     node /abs/path/to/limpid/apps/cli/dist/cli.js
repos:
  - repo: local
    hooks:
      - id: limpid
        name: limpid writing check
        entry: node /abs/path/to/cli/limpid.js --max-passive 0.4 --min-grade C
        language: system
        files: \.(tex|md)$
        pass_filenames: true
